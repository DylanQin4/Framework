<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layouts/app :: layout('Paramétrage - Tarifs par type', ~{::content})}">
    <title>Paramétrage - Tarifs par type</title>

    <div th:fragment="content">
        <div class="bg-white max-w-3xl mx-auto p-4 rounded-xl shadow">
            <h1 class="text-2xl font-semibold mb-4">Tarifs par type de passager</h1>

            <div th:if="${saved}" class="mb-4 rounded-lg bg-green-50 p-3 text-green-700">
                Modifications enregistrées.
            </div>

            <form th:action="@{/admin/settings/config-fares}" method="post" th:object="${form}" class="space-y-4">
                <div th:if="${#fields.hasErrors('*')}" class="mb-4 rounded bg-red-50 p-3 text-red-700">
                    <ul>
                        <li th:each="e : ${#fields.errors('*')}" th:text="${e}">Error</li>
                    </ul>
                </div>

                <div class="bg-white rounded-xl shadow p-4">
                    <table class="w-full table-auto">
                        <thead class="text-left text-xs text-gray-500 uppercase">
                            <tr>
                                <th class="py-2">Type</th>
                                <th class="py-2">Prix</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            <tr th:each="item, iStat : *{items}">
                                <!-- champs cachés -->
                                <input type="hidden" th:field="*{items[__${iStat.index}__].id}" />
                                <input type="hidden" th:field="*{items[__${iStat.index}__].passengerTypeId}" />

                                <td class="py-2">
                                    <span class="font-medium" th:text="*{items[__${iStat.index}__].typeName}">ADULT</span>
                                </td>
                                <td class="py-2">
                                    <input type="number" min="0" step="0.01"
                                           class="w-32 rounded border px-2 py-1"
                                           th:field="*{items[__${iStat.index}__].price}" />
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="flex w-full gap-3 justify-center">
                    <button type="submit"
                            class="rounded-xl bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">
                        Enregistrer
                    </button>
                    <a href="/" class="rounded-xl border px-4 py-2 hover:bg-gray-50">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</th:block>
</html>
