<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Connexion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link th:href="@{/css/output.css}" rel="stylesheet" />
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">
  <div class="w-full max-w-md bg-white shadow rounded-2xl p-8">
    <h1 class="text-2xl font-semibold mb-6 text-center">Connexion</h1>

    <div th:if="${param.error}" class="mb-4 text-sm text-red-600 bg-red-50 rounded p-3">
      Email ou mot de passe invalide.
    </div>
    <div th:if="${param.logout}" class="mb-4 text-sm text-green-700 bg-green-50 rounded p-3">
      Déconnexion réussie.
    </div>

    <form method="post" th:action="@{/login}" class="space-y-4">
      <div>
        <label class="block text-sm mb-1" for="email">Email</label>
        <input id="email" name="email" type="email" value="admin@example.com" required
               class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-200" />
      </div>
      <div>
        <label class="block text-sm mb-1" for="password">Mot de passe</label>
        <input id="password" name="password" type="password" value="admin123" required
               class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-200" />
      </div>

      <button type="submit"
              class="w-full rounded-lg px-4 py-2 bg-indigo-600 text-white font-medium hover:bg-indigo-700">
        Se connecter
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-gray-500">
      Démo: utilisez <strong>admin@example.com / admin123</strong> ou <strong>user1@example.com / password1</strong>
    </p>
  </div>
</body>
</html>
